    <style>
         :root {
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --dark-bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.45);
            --text-light: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.06);
            --blur-effect: blur(16px);
            --input-text: #ffffff;
            --countdown-text: #ffffff;
        }

        /* Light Mode Variables */
        body.light-grid-theme {
            --body-bg: #e2e8f0;
            --content-text: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-muted: #334155;
            --border-color: rgba(66, 133, 244, 0.4);
            --input-text: #0f172a;
            --countdown-text: #0f172a;
            background: linear-gradient(135deg, #cbd5e1, hsl(213, 97%, 87%), #fecaca, #fef08a, #bbf7d0);
            background-size: 400% 400%;
            animation: gradientWave 15s ease infinite;
        }

        /* Grid Effect for Light Mode */
        body.light-grid-theme::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background-image: linear-gradient(rgba(66, 133, 244, 0.06) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(66, 133, 244, 0.06) 1.5px, transparent 1.5px);
            background-size: 30px 30px; pointer-events: none;
        }

        @keyframes gradientWave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            transition: background 0.5s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* Dynamic Background Orbs */
        .google-orb { position: absolute; border-radius: 50%; z-index: -2; filter: blur(130px); pointer-events: none; }
        .orb-1 { background-color: rgba(66, 133, 244, 0.3); width: 600px; height: 600px; top: -10%; left: -10%; }
        .orb-2 { background-color: rgba(234, 67, 53, 0.25); width: 500px; height: 500px; bottom: -10%; right: -10%; }
        body.light-grid-theme .google-orb { display: none; }

        /* Container styling to properly align card */
        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Event Card Size */
        .event-card { 
            width: 100%; 
            max-width: 750px; 
            background: var(--card-bg); 
            backdrop-filter: var(--blur-effect); 
            padding: 40px; 
            border-radius: 32px; 
            border: 1px solid var(--border-color); 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            margin-top: 100px;
            box-sizing: border-box;
        }

        h1 { margin-bottom: 20px; font-weight: 800; color: var(--text-light); font-size: 2.2rem; }
        body.light-grid-theme h1 { color: #0f172a; }

        .status-badge { display: inline-block; padding: 10px 20px; margin-bottom: 25px; background: rgba(66, 133, 244, 0.1); border: 1px solid var(--google-blue); color: var(--google-blue); border-radius: 50px; font-size: 0.9rem; font-weight: 700; }

        .countdown-container {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; font-family: monospace; color: var(--countdown-text);
        }

        .iframe-wrap { width: 100%; height: 600px; border-radius: 16px; overflow: hidden; background: #fff; margin-top: 20px; }
        
        /* Navigation Buttons Responsive Positions */
        .theme-toggle-btn {
            position: absolute; top: 35px; right: 6%; background-color: var(--card-bg); backdrop-filter: var(--blur-effect); border: 2px solid var(--google-blue); padding: 14px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; transition: 0.4s; z-index: 10;
        }
        .theme-toggle-btn:hover { transform: scale(1.1) rotate(12deg); }
        .fa-sun { color: var(--google-yellow); display: none; }
        .fa-moon { color: var(--google-blue); display: block; }
        body.light-grid-theme .fa-sun { display: block; }
        body.light-grid-theme .fa-moon { display: none; }

        .btn-back { position: absolute; top: 35px; left: 6%; display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; font-weight: 600; padding: 12px 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 30px; backdrop-filter: var(--blur-effect); transition: 0.3s; z-index: 10; }
        body.light-grid-theme .btn-back { color: #0f172a; }

        footer { padding: 30px; text-align: center; color: #64748b; font-size: 0.9rem; }

        /* Media Queries for Mobile Responsiveness */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .event-card { padding: 25px 15px; margin-top: 120px; border-radius: 24px; }
            h1 { font-size: 1.6rem; }
            .btn-back { padding: 8px 16px; font-size: 0.85rem; top: 20px; left: 4%; }
            .theme-toggle-btn { width: 45px; height: 45px; padding: 10px; top: 20px; right: 4%; }
            .countdown-container { gap: 10px; }
            .countdown-container style div { font-size: 1.5rem !important; }
            .iframe-wrap { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="google-orb orb-1"></div>
    <div class="google-orb orb-2"></div>

    <a href="index.html" class="btn-back"><i class="fas fa-chevron-left"></i> Back to Home</a>

    <button class="theme-toggle-btn" onclick="document.body.classList.toggle('light-grid-theme')">
        <i class="fas fa-moon"></i><i class="fas fa-sun"></i>
    </button>

    <main class="container">
        <div class="event-card">
            <h1>Campus Interviews</h1>
            <!-- Status Badge -->
            <div class="status-badge"><i class="fas fa-clock"></i> <span id="status-text">Loading...</span></div>

            <!-- Countdown Timer -->
            <div class="countdown-container">
                <div style="text-align: center;"><div id="days" style="font-size: 2rem;">00</div><div style="font-size: 0.5rem; color: #64748b;">DAYS</div></div>
                <div style="font-size: 1.5rem; margin-top: 5px;">:</div>
                <div style="text-align: center;"><div id="hours" style="font-size: 2rem;">00</div><div style="font-size: 0.5rem; color: #64748b;">HRS</div></div>
                <div style="font-size: 1.5rem; margin-top: 5px;">:</div>
                <div style="text-align: center;"><div id="mins" style="font-size: 2rem;">00</div><div style="font-size: 0.5rem; color: #64748b;">MIN</div></div>
            </div>
            
            <div class="iframe-wrap">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScZnPxfzasn1eeLZh4BKELI8exH1LwrlnNx1o4kVSoQwOGvSA/viewform?embedded=true" width="640" height="1631" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Adhyatmantan Farm. All Rights Reserved.</p>
    </footer>

    <script>
    // तारखा सेटिंग
    const startDateInput = "July 6, 2026 00:00:00"; 
    const endDateInput = "July 10, 2026 23:59:59";
    const eventDateInput = "July 14, 2026 10:00:00"; // इव्हेंटची तारीख

    function updateCountdown() {
        const now = new Date().getTime();
        const regStart = new Date(startDateInput).getTime();
        const regEnd = new Date(endDateInput).getTime();
        const eventDate = new Date(eventDateInput).getTime();
        
        const statusText = document.getElementById("status-text");
        let targetDate;

        if (now < regStart) {
            targetDate = regStart;
            statusText.innerText = "Registration Starts July 6";
        } else if (now >= regStart && now <= regEnd) {
            targetDate = regEnd;
            statusText.innerText = "Registration Ends In";
        } else if (now > regEnd && now < eventDate) {
            targetDate = eventDate;
            statusText.innerText = "Registration Closed - Event in";
        } else {
            statusText.innerText = "Event Started/Finished";
            document.getElementById("days").innerText = "00";
            document.getElementById("hours").innerText = "00";
            document.getElementById("mins").innerText = "00";
            return;
        }

        const diff = targetDate - now;
        if (diff > 0) {
            document.getElementById("days").innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("mins").innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();
    </script>

</body>
</html>
