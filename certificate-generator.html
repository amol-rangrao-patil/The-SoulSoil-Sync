<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator - The SoulSoil Sync </title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Montserrat:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JSZip Engine for client-side compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --surface: #ffffff;
            
            /* Authentic Identity Google Palette */
            --google-blue: #1a73e8;
            --google-red: #ea4335;
            --google-yellow: #fbbc05;
            --google-green: #34a853;
            
            --text-main: #1f1f1f;
            --text-muted: #5f6368;
            --border: #dadce0;
            --radius-lg: 16px;
            --radius-md: 8px;
            --transition-smooth: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- GOOGLE DESIGN SYSTEM NAVBAR --- */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 22px;
            color: #3c4043;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }
        .navbar-brand span.dots-container {
            display: flex;
            gap: 3px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-b { background: var(--google-blue); }
        .dot-r { background: var(--google-red); }
        .dot-y { background: var(--google-yellow); }
        .dot-g { background: var(--google-green); }

        /* --- WAVE LETTER ANIMATION --- */
        .wave-text {
            display: inline-flex;
        }
        .wave-text span {
            display: inline-block;
            animation: bounceUpDown 2s infinite ease-in-out;
        }
        .wave-text span.space {
            width: 6px;
        }

        @keyframes bounceUpDown {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .badge-deadline {
            background: #fce8e6;
            color: var(--google-red);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #fad2cf;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- WORKBENCH LAYOUT GRID --- */
        .workbench {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 40px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 40px;
            flex: 1;
        }

        /* --- CONTROL CARD PANEL --- */
        .control-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 30px;
            height: fit-content;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #3c4043;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: var(--google-blue);
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #3c4043;
        }
        
        /* Dropzones */
        .file-dropzone {
            border: 1px dashed var(--border);
            padding: 22px;
            border-radius: var(--radius-md);
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
        }
        .file-dropzone:hover {
            border-color: var(--google-blue);
            background: #f4f8fe;
        }
        .file-dropzone i {
            font-size: 24px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .file-dropzone p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .file-dropzone input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Inputs */
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            background: #ffffff;
            color: var(--text-main);
            transition: var(--transition-smooth);
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        textarea {
            height: 110px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
            background: #f8fafc;
        }

        /* Action Buttons Suite */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 25px;
        }
        .btn-ui {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition-smooth);
        }
        .btn-ui-primary {
            background: var(--google-blue);
            color: #ffffff;
        }
        .btn-ui-primary:hover {
            background: #1557b0;
            box-shadow: 0 1px 3px 0 rgba(66,133,244,0.3);
        }
        .btn-ui-success {
            background: var(--google-green);
            color: #ffffff;
        }
        .btn-ui-success:hover {
            background: #137333;
            box-shadow: 0 1px 3px 0 rgba(52,168,83,0.3);
        }
        
        /* Progress Bar */
        .status-container {
            margin-top: 20px;
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border);
            display: none;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #e8eaed;
            height: 6px;
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--google-blue), var(--google-green));
            width: 0%;
            height: 100%;
            transition: width 0.1s ease;
        }

        /* --- PREVIEW PANEL --- */
        .preview-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .preview-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .canvas-frame {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #f8fafc;
        }

        /* --- GOOGLE-INSPIRED PROFESSIONAL FOOTER --- */
        footer {
            background: #ffffff;
            color: var(--text-muted);
            padding: 40px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            margin-top: auto;
        }
        .footer-main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
            margin-bottom: 20px;
        }
        .footer-logo {
            color: #3c4043;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer-socials {
            display: flex;
            gap: 16px;
        }
        .footer-socials a {
            background: #f8fafc;
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: var(--transition-smooth);
        }
        .footer-socials a:hover {
            background: #f1f3f4;
            color: var(--google-blue);
            border-color: #aecbfa;
            transform: translateY(-2px);
        }
        .footer-socials a svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .footer-meta {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
        }

        @media (max-width: 992px) {
            .workbench { grid-template-columns: 1fr; padding: 20px; }
            .navbar { padding: 14px 24px; }
            .footer-main, .footer-meta { flex-direction: column; gap: 24px; text-align: center; }
        }
    </style>
</head>

    <script>
        const brandString = "The SoulSoil Sync   ";
        const brandContainer = document.getElementById("animatedBrand");
        
        brandString.split("").forEach((char, index) => {
            const span = document.createElement("span");
            if (char === " ") {
                span.classList.add("space");
            } else {
                span.textContent = char;
                span.style.animationDelay = `${index * 0.08}s`;
            }
            brandContainer.appendChild(span);
        });

        const canvas = document.getElementById('certCanvas');
        const ctx = canvas.getContext('2d');

        const templateInput = document.getElementById('templateInput');
        const sigImageInput = document.getElementById('sigImageInput');
        const dateInput = document.getElementById('dateInput');
        const namesInput = document.getElementById('namesInput');
        const previewBtn = document.getElementById('previewBtn');
        const bulkDownloadBtn = document.getElementById('bulkDownloadBtn');
        
        const statusContainer = document.getElementById('statusContainer');
        const statusMessage = document.getElementById('statusMessage');
        const statusPercent = document.getElementById('statusPercent');
        const progressBarFill = document.getElementById('progressBarFill');

        let bgImage = new Image();
        let sigImage = new Image();
        let isTemplateLoaded = false;
        let isSigLoaded = false;

        templateInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { bgImage.src = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        bgImage.onload = function() {
            canvas.width = bgImage.naturalWidth;
            canvas.height = bgImage.naturalHeight;
            isTemplateLoaded = true;
            renderSinglePreview();
        };

        sigImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { sigImage.src = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        sigImage.onload = function() {
            isSigLoaded = true;
            renderSinglePreview();
        };

        function getNameList() {
            return namesInput.value.split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);
        }

        function drawCertificateData(context, targetCanvas, nameText, dateText) {
            context.drawImage(bgImage, 0, 0);

            // 1. Participant Name Layer Alignment Metrics
            context.font = "italic 700 " + Math.round(targetCanvas.height * 0.055) + "px 'Montserrat', sans-serif";
            context.fillStyle = "#1f1f1f"; 
            context.textAlign = "center";
            context.textBaseline = "bottom";
            
            const nameX = targetCanvas.width * 0.50;
            const nameY = targetCanvas.height * 0.535; 
            context.fillText(nameText, nameX, nameY);

            // 2. Timeline Calendar Date Stamp
            context.font = "500 " + Math.round(targetCanvas.height * 0.025) + "px 'Plus Jakarta Sans', sans-serif";
            context.fillStyle = "#444746";
            
            const dateX = targetCanvas.width * 0.188;
            const dateY = targetCanvas.height * 0.84;
            context.fillText(dateText, dateX, dateY);

            // 3. Signature Layout Matrix Mapping
            if (isSigLoaded) {
                const sigWidth = targetCanvas.width * 0.14; 
                const sigHeight = (sigImage.naturalHeight / sigImage.naturalWidth) * sigWidth;
                
                const sigX = (targetCanvas.width * 0.812) - (sigWidth / 2);
                const sigY = (targetCanvas.height * 0.842) - sigHeight - 5; 
                
                context.drawImage(sigImage, sigX, sigY, sigWidth, sigHeight);
            }
        }

        function renderSinglePreview() {
            if (!isTemplateLoaded) {
                canvas.width = 1000;
                canvas.height = 707;
                ctx.fillStyle = "#f8fafc";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#5f6368";
                ctx.font = "15px 'Plus Jakarta Sans'";
                ctx.textAlign = "center";
                ctx.fillText("Ready. Please upload 'Certificate of Participation .jpg' context template...", canvas.width/2, canvas.height/2);
                return;
            }
            const names = getNameList();
            const firstParticipant = names.length > 0 ? names[0] : "Roster Data Line Item Preview";
            drawCertificateData(ctx, canvas, firstParticipant, dateInput.value);
        }

        previewBtn.addEventListener('click', renderSinglePreview);
        dateInput.addEventListener('input', renderSinglePreview);

        window.onload = () => { renderSinglePreview(); };

        // --- BULK EXTRACTION ZIP PACKAGING ENGINE ---
        bulkDownloadBtn.addEventListener('click', async () => {
            const names = getNameList();
            if (names.length === 0 || !isTemplateLoaded) {
                alert("Roster configuration context empty or base workspace template missing.");
                return;
            }

            statusContainer.style.display = "block";
            const zip = new JSZip();

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const exportCtx = exportCanvas.getContext('2d');

            for(let i = 0; i < names.length; i++) {
                const currentParticipant = names[i];
                const progressInt = Math.round(((i + 1) / names.length) * 100);
                
                statusMessage.textContent = `Compiling asset structure: ${currentParticipant}`;
                statusPercent.textContent = `${progressInt}%`;
                progressBarFill.style.width = `${progressInt}%`;

                drawCertificateData(exportCtx, exportCanvas, currentParticipant, dateInput.value);

                const blob = await new Promise(resolve => exportCanvas.toBlob(resolve, 'image/png', 1.0));
                
                // FORMAT CONFIG: Strict only name output formatting
                const pureNameFile = currentParticipant.replace(/[^a-zA-Z0-9]/g, "_");
                zip.file(`${pureNameFile}.png`, blob);
            }

            statusMessage.textContent = "Packing files into compressed archive package...";
            
            zip.generateAsync({type: "blob"}).then(function(content) {
                const zipLink = document.createElement('a');
                zipLink.download = "SoulSoil_Sync_Certificates.zip";
                zipLink.href = URL.createObjectURL(content);
                zipLink.click();
                
                statusMessage.textContent = "Production pipeline run completed successfully!";
                setTimeout(() => { statusContainer.style.display = "none"; }, 4000);
            });
        });
    </script>
</body>
</html>
